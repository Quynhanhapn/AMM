<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Không tìm thấy trang | AMM Germany Nutrition</title>
  <meta name="description" content="Trang bạn tìm kiếm không tồn tại hoặc đã được thay đổi. Trở về website AMM Germany Nutrition để tiếp tục khám phá.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#06377f">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="site.css">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 75% 20%,rgba(31,177,236,.22),transparent 30%),linear-gradient(145deg,#021f50,#0756b8);color:#fff}
    .error-card{width:min(720px,100%);padding:clamp(34px,7vw,72px);border:1px solid rgba(255,255,255,.2);border-radius:30px;background:rgba(255,255,255,.1);box-shadow:0 30px 90px rgba(0,18,55,.3);backdrop-filter:blur(14px);text-align:center}
    .error-card img{width:150px;margin:0 auto 28px;padding:14px;border-radius:18px;background:#fff}
    .error-code{margin:0;color:#91ddff;font-size:clamp(4rem,14vw,8rem);font-weight:900;line-height:.85}
    .error-card h1{margin-top:20px;color:#fff;font-size:clamp(2rem,5vw,3.7rem)}
    .error-card p{max-width:560px;margin:18px auto 30px;color:#dcecff;font-size:1.04rem}
    .error-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    @media(max-width:520px){.error-actions .btn{width:100%}}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card" aria-labelledby="error-title">
      <img src="amm-logo.webp" width="467" height="331" alt="AMM Germany Nutrition">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 id="error-title">Không tìm thấy trang</h1>
      <p>Đường dẫn bạn truy cập không tồn tại hoặc đã được thay đổi. Hãy trở về trang chủ hoặc liên hệ AMM để được hỗ trợ.</p>
      <div class="error-actions"><a class="btn btn-light" href="index.html">Về trang chủ →</a><a class="btn btn-ghost-light" href="lien-he.html">Liên hệ AMM</a></div>
    </section>
  </main>
</body>
</html>
